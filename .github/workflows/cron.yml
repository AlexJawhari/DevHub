name: Scheduled checks
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger monitoring and scheduled scans
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 240 --retry 2 --retry-delay 20 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$BACKEND_URL/api/cron/run"
